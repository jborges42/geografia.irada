<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geografia Irada — Missão 2050</title>
<meta name="description" content="Jogo de geopolítica para o Ensino Médio: cada equipe governa uma potência de 2026 a 2050 e as decisões mudam o mundo inteiro.">
<meta name="theme-color" content="#22339A">
<link rel="icon" href="img/favicon.png" type="image/png">
<!-- Fichas de design e componentes (Fundação) → ornamentos (Ilustração) → um CSS por módulo -->
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/arte.css">
<link rel="stylesheet" href="css/telas.css">
<link rel="stylesheet" href="css/jogo.css">
<link rel="stylesheet" href="css/plantao.css">
<link rel="stylesheet" href="css/dilemas.css">
<link rel="stylesheet" href="css/onu.css">
<link rel="stylesheet" href="css/relatorios.css">
<link rel="stylesheet" href="css/manual.css">
</head>
<body class="jogo">
<noscript>
  <section class="painel peca pinos painel-p" style="position:fixed;inset:0;margin:auto;height:fit-content;max-width:92vw">
    <header class="painel-cab"><h1 class="painel-titulo">Falta só um detalhe!</h1></header>
    <div class="tela"><p style="font-size:var(--fs-corpo)">O Geografia Irada precisa do JavaScript ligado no navegador.
      Ative-o e abra o jogo de novo: ele funciona sem internet, direto deste arquivo.</p></div>
  </section>
</noscript>

<div id="mundo" aria-hidden="true"></div>                <!-- canvas do Mapa3D: fundo de tudo (z 0) -->
<div id="rotulos-mapa"></div>                              <!-- rótulos HTML que acompanham o mapa (z 1) -->
<div id="cena" hidden></div>                               <!-- canvas do Cenas3D: lobby, ONU, revelação, pódio (z 5) -->
<main id="telas">                                          <!-- telas de página inteira (z 10): mostrarTela(nome) -->
  <section id="tela-inicio" class="tela" aria-label="Início"></section>
  <section id="tela-lobby" class="tela" aria-label="Delegações" hidden></section>
  <section id="tela-revelacao" class="tela" aria-label="Revelação secreta" hidden></section>
  <section id="tela-partida" class="tela" aria-label="Partida" hidden></section>
  <section id="tela-fim" class="tela" aria-label="Fim da partida" hidden></section>
</main>
<div id="camada"></div>                                    <!-- painéis por cima do jogo (z 20): abrirPainel/fecharPainel -->
<div id="splash" aria-hidden="true" hidden>                <!-- faixa de anúncio de splash() (z 40) -->
  <div class="splash-faixa faixa peca pinos cor-herdada">
    <span id="splash-icone" class="faixa-icone soquete"></span>
    <div class="faixa-textos">
      <div id="splash-pre" class="letra-bolha"></div>
      <div id="splash-titulo" class="letra-bolha"></div>
      <div id="splash-sub" class="letra-bolha"></div>
    </div>
  </div>
</div>
<div id="aviso" role="status" hidden></div>               <!-- avisos curtos de aviso() (z 50) -->
<div id="anuncio" class="so-leitor" aria-live="polite"></div>

<script src="lib/three.min.js"></script>
<script src="lib/gsap.min.js"></script>
<script src="lib/confetti.min.js"></script>
<script src="dados/mapa.js"></script>
<script src="dados/projecoes.js"></script>
<script src="dados/modelos.js"></script>
<script src="dados/creditos.js"></script>
<script src="conteudo/potencias.js"></script>
<script src="conteudo/territorios.js"></script>
<script src="conteudo/politicas.js"></script>
<script src="conteudo/eventos.js"></script>
<script src="conteudo/resolucoes.js"></script>
<script src="conteudo/dilemas.js"></script>
<script src="conteudo/fichas.js"></script>
<script src="conteudo/manual.js"></script>
<script src="conteudo/bncc.js"></script>
<script src="js/icones.js"></script>
<script src="js/arte.js"></script>
<script src="js/ui.js"></script>
<script src="js/audio.js"></script>
<script src="js/simulacao.js"></script>
<script src="js/bonecos.js"></script>
<script src="js/mapa3d.js"></script>
<script src="js/cenas3d.js"></script>
<script src="js/mascote.js"></script>
<script src="js/plantao.js"></script>
<script src="js/dilemas.js"></script>
<script src="js/onu.js"></script>
<script src="js/relatorios.js"></script>
<script src="js/manual.js"></script>
<script src="js/hud.js"></script>
<script src="js/telas.js"></script>
<script src="js/jogo.js"></script>
<script>
  'use strict';
  // Começa pela tela inicial assim que as fontes do jogo estiverem prontas
  fontesProntas.then(() => { if (typeof Telas !== 'undefined') Telas.inicio(); });
</script>
</body>
</html>
