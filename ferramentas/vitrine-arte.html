<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geografia Irada — vitrine de arte</title>
<link rel="icon" href="../img/favicon.png" type="image/png">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/arte.css">
<style>
  /* Vitrine (ferramenta da frente de Ilustração): galeria de tudo o que o kit desenha, no palco 16:9 do jogo */
  html, body { height: auto; min-height: 100%; }
  body { overflow: auto; padding: calc(2 * var(--u)) calc(2.6 * var(--u)) calc(4 * var(--u)); }
  .v-topo { display: flex; align-items: center; gap: calc(2.4 * var(--u)); margin-bottom: calc(2 * var(--u)); }
  .v-topo svg.logo { width: calc(24 * var(--u)); }
  .v-topo h1 { font: 700 var(--fs-h2) / 1 var(--f-titulo); }
  .v-abas { display: flex; flex-wrap: wrap; gap: calc(.9 * var(--u)); margin-left: auto; }
  .v-abas a { --lado: calc(.6 * var(--u)); padding: calc(.7 * var(--u)) calc(1.4 * var(--u)); font: 700 var(--fs-min) / 1 var(--f-titulo); text-decoration: none; }
  .v-abas a[aria-current="page"] { --cor: var(--amarelo); --cor-lado: var(--amarelo-lado); }
  .v-grade { display: grid; gap: calc(1.6 * var(--u)); }
  .v-cartao { --lado: calc(.9 * var(--u)); padding: calc(1.4 * var(--u)) calc(1.8 * var(--u)) calc(1.8 * var(--u)); border-radius: calc(1.8 * var(--u)); }
  .v-cartao h2 { font: 700 var(--fs-cartao) / 1 var(--f-titulo); margin-bottom: calc(1.2 * var(--u)); }
  .v-cartao.mesa { --cor: var(--mesa-meio); --cor-lado: var(--mesa-base); background: var(--pinos-mesa) 0 0 / calc(4 * var(--u)) calc(4 * var(--u)), var(--mesa); }
  .v-cartao.mesa > h2, .v-cartao.mapa > h2 { color: #fff; -webkit-text-stroke: .17em var(--tinta); paint-order: stroke fill; }
  .v-cartao.mapa { --cor: #38B1DC; background: var(--mapa) center / cover; }
  .v-linha { display: flex; flex-wrap: wrap; align-items: flex-end; gap: calc(1.2 * var(--u)) calc(2 * var(--u)); }
  .v-rot { display: block; margin-top: calc(.4 * var(--u)); font: 800 var(--fs-min) / 1.1 var(--f-texto); color: var(--tinta-suave); text-align: center; }
  .mesa .v-rot, .mapa .v-rot { color: #fff; -webkit-text-stroke: .2em var(--tinta); paint-order: stroke fill; }
  .v-item { display: grid; justify-items: center; }
  .v-icones { display: grid; grid-template-columns: repeat(auto-fill, minmax(calc(7.4 * var(--u)), 1fr)); gap: calc(.6 * var(--u)); }
  .v-icones figure { display: grid; justify-items: center; gap: calc(.2 * var(--u)); margin: 0; padding: calc(.5 * var(--u)) 0; border-radius: calc(1 * var(--u)); background: #fff; border: calc(.25 * var(--u)) solid var(--ladrilho-2); }
  .v-icones img { width: calc(4.8 * var(--u)); }
  .v-icones figcaption { font: 900 calc(1.5 * var(--u)) / 1 var(--f-texto); color: var(--tinta-suave); }
  .v-botoes { display: flex; flex-wrap: wrap; gap: calc(1 * var(--u)); }
  .v-btn-ic { display: grid; place-items: center; width: calc(6.4 * var(--u)); height: calc(6.4 * var(--u)); border-radius: 50%; }
  .v-btn-ic > img { width: calc(3.4 * var(--u)); }
  /* composições de exemplo */
  .v-jornal { padding-bottom: calc(1.6 * var(--u)); }
  .v-jornal .jornal-cab { padding-top: calc(3 * var(--u)); }
  .v-noticias { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: calc(2 * var(--u)); padding: calc(1.6 * var(--u)) calc(2.4 * var(--u)) 0; }
  .v-noticias article { display: grid; align-content: start; gap: calc(.8 * var(--u)); }
  .v-noticias article + article { border-left: calc(.15 * var(--u)) solid rgb(26 20 51 / .25); padding-left: calc(2 * var(--u)); }
  .v-noticias h3 { font: 700 var(--fs-cartao) / 1.08 var(--f-titulo); text-wrap: balance; }
  .v-noticias article:first-child h3 { font-size: var(--fs-h2); }
  .v-noticias p { font: 800 var(--fs-min) / 1.3 var(--f-texto); color: var(--tinta-suave); }
  .v-noticias .v-foto { display: grid; place-items: center; height: calc(15 * var(--u)); border-radius: calc(1 * var(--u)); border: var(--b-fino) solid var(--tinta);
    background: radial-gradient(circle at 50% 120%, var(--cat, var(--cat-natureza)) 0 55%, color-mix(in oklab, var(--cat, var(--cat-natureza)), #fff 55%) 56%); box-shadow: var(--rebaixo); }
  .v-noticias .v-foto { overflow: hidden; }
  .v-noticias .v-foto .arte { width: calc(21 * var(--u)); max-width: none; margin: calc(-1 * var(--u)) 0 calc(-3 * var(--u)); }
  .v-chip-cat { display: inline-flex; align-items: center; gap: calc(.5 * var(--u)); width: fit-content; padding: calc(.25 * var(--u)) calc(1 * var(--u)) calc(.25 * var(--u)) calc(.3 * var(--u));
    background: var(--cor); border: var(--b-fino) solid var(--tinta); border-radius: 99px; font: 700 var(--fs-min) / 1 var(--f-titulo); box-shadow: var(--sombra-chip); }
  .v-chip-cat .ico { width: calc(2.6 * var(--u)); }
  .v-critico { position: relative; display: flex; align-items: center; gap: calc(1.2 * var(--u)); margin: calc(1.8 * var(--u)) calc(2.4 * var(--u)) 0; padding: calc(.8 * var(--u)) calc(1.6 * var(--u)) calc(1.4 * var(--u));
    background: var(--pessego-alerta); border: var(--b-fino) solid var(--tinta); border-radius: calc(1 * var(--u)); font: 800 var(--fs-corpo) / 1.2 var(--f-texto); overflow: hidden; }
  .v-critico .zebra { left: 0; right: 0; }
  .v-tv { position: relative; display: grid; grid-template-columns: auto 1fr; align-items: end; gap: calc(2 * var(--u)); padding: calc(10 * var(--u)) calc(2 * var(--u)) calc(2 * var(--u)); }
  .v-bancada { position: relative; display: grid; justify-items: center; }
  .v-bancada .arte { width: calc(14 * var(--u)); margin-bottom: calc(-3.4 * var(--u)); position: relative; z-index: 1; rotate: 8deg; }
  .v-bancada .v-mesa { --cor: var(--ladrilho); --lado: calc(1.2 * var(--u)); width: calc(24 * var(--u)); height: calc(9 * var(--u)); border-radius: calc(1.4 * var(--u)) calc(1.4 * var(--u)) calc(.6 * var(--u)) calc(.6 * var(--u));
    background: linear-gradient(transparent 46%, var(--vermelho-alerta) 46% 64%, transparent 64%), linear-gradient(#fff, var(--ladrilho) 50%); display: grid; place-items: center; }
  .v-bancada .v-pg { padding: calc(.3 * var(--u)) calc(1.2 * var(--u)); background: var(--amarelo); border: var(--b-fino) solid var(--tinta); border-radius: calc(.8 * var(--u)); font: 400 calc(3 * var(--u)) / 1 var(--f-marca); color: #fff; -webkit-text-stroke: .17em var(--tinta); paint-order: stroke fill; rotate: -6deg; }
  .v-sabia { display: flex; align-items: center; gap: calc(1.2 * var(--u)); margin-top: calc(1.4 * var(--u)); padding: calc(1 * var(--u)) calc(1.6 * var(--u)); background: var(--ladrilho-2); border: var(--b-fino) solid var(--tinta); border-radius: calc(1.2 * var(--u));
    box-shadow: var(--rebaixo); font: 800 var(--fs-min) / 1.3 var(--f-texto); }
  .v-sabia .arte { width: calc(8 * var(--u)); flex: none; margin: calc(-2 * var(--u)) 0; }
  .v-sabia b { display: block; font: 700 var(--fs-cartao) / 1 var(--f-titulo); }
  .v-painel { --larg: auto; max-width: none; }
  .v-opcoes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: calc(1.6 * var(--u)); margin-top: calc(1.4 * var(--u)); }
  .v-opcao { --lado: calc(1 * var(--u)); display: grid; justify-items: center; gap: calc(.8 * var(--u)); padding: calc(1.2 * var(--u)) calc(1.4 * var(--u)) calc(1.6 * var(--u)); text-align: center; border-radius: calc(1.8 * var(--u)); }
  .v-opcao .arte { width: calc(12 * var(--u)); margin-top: calc(-5 * var(--u)); }
  .v-opcao .v-cargo { font: 700 var(--fs-min) / 1 var(--f-titulo); }
  .v-opcao .balao { width: 100%; font-size: var(--fs-min); }
  .v-opcao .carimbo { --tam: calc(3.6 * var(--u)); position: absolute; top: 44%; left: 50%; translate: -50% 0; }
  .v-balanco { display: grid; grid-template-columns: 1fr 1fr; gap: calc(1.6 * var(--u)); }
  .v-indic { --lado: calc(.8 * var(--u)); display: grid; gap: calc(.6 * var(--u)); padding: calc(1.2 * var(--u)) calc(1.6 * var(--u)); border-radius: calc(1.6 * var(--u)); }
  .v-indic h4 { display: flex; align-items: center; gap: calc(.6 * var(--u)); font: 700 var(--fs-cartao) / 1 var(--f-titulo); margin: 0; }
  .v-indic .num { font-size: calc(5.2 * var(--u)); line-height: 1; }
  [hidden] { display: none !important; }
</style>
</head>

<script>
'use strict';
/* Estúdio de brinquedo (guia §4.2): monta cada objeto do kit só com peças (tijolo, placa, ladrilho, peça redonda, pino com
   bisel, barra, cone, arco), fotografa com a luz da bancada (chave quente, recorte azul, preenchimento arroxeado, reflexo de
   sala), sombra projetada + sombra de contato, e aplica o contorno de adesivo índigo. Renderiza a 1024 e reduz para 512. */
const Estudio = (() => {
  const LADO = 512, SS = 2, PX = LADO * SS;
  const T = '#1A1433', AMARELO = '#FFD21F', AMARELO_L = '#B98A00', LADRILHO = '#FFF9EC', PRETA = '#2B2747', MADEIRA = '#B0743C',
    CAIXOTE = '#C98B4E', OURO = '#FFC93C', CINZA = '#A0A5A9', CINZA_E = '#6C6E68', PRATA = '#D5DEEA', VERDE_OK = '#3CD46A',
    VERMELHO = '#F0303A', ANIL = '#3550C8', BRANCO = '#FFFFFF';
  let renderer = null, ambiente = null;
  function iniciar() {
    if (renderer) return;
    renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(1); renderer.setSize(PX, PX); renderer.setClearColor(0x000000, 0);
    renderer.toneMapping = THREE.NeutralToneMapping; renderer.toneMappingExposure = 1; renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFShadowMap;
    ambiente = new THREE.PMREMGenerator(renderer).fromScene(new THREE.RoomEnvironment(), .04).texture;
  }

  // ---------------- materiais ----------------
  let nPeca = 0;
  const variar = (c, k) => new THREE.Color(c).offsetHSL(0, 0, ((Math.sin(k * 12.9898) * 43758.5453 % 1) - .5) * .03);
  const plastico = (c, rug = .3) => new THREE.MeshStandardMaterial({ color: variar(c, ++nPeca), roughness: rug, metalness: 0 });
  const liso = (c, rug = .3) => new THREE.MeshStandardMaterial({ color: c, roughness: rug, metalness: 0 });
  const vidro = (c = '#CFEFFF', op = .45) => new THREE.MeshStandardMaterial({ color: c, transparent: true, opacity: op, roughness: .05, metalness: 0, envMapIntensity: 1.6, depthWrite: false });
  const ouro = (c = OURO) => new THREE.MeshStandardMaterial({ color: c, metalness: .55, roughness: .28 });
  const luz = (c, forca = .8) => new THREE.MeshStandardMaterial({ color: c, emissive: c, emissiveIntensity: forca, roughness: .3, metalness: 0 });
  function textura(desenhar, w = 512, h = 512, fundo = null) {
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h; const g = cv.getContext('2d');
    if (fundo) { g.fillStyle = fundo; g.fillRect(0, 0, w, h); }
    desenhar(g, w, h);
    const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
  }
  const impresso = (desenhar, w, h, fundo = LADRILHO, rug = .35) => new THREE.MeshStandardMaterial({ map: textura(desenhar, w, h, fundo), roughness: rug, metalness: 0 });
  // Texto com contorno (letra-bolha) num canvas
  function bolha(g, txt, x, y, px, { fonte = '"Titan One"', cor = BRANCO, borda = T, larg = .17, alinhar = 'center' } = {}) {
    g.font = `${px}px ${fonte}`; g.textAlign = alinhar; g.textBaseline = 'middle'; g.lineJoin = 'round';
    if (borda) { g.strokeStyle = borda; g.lineWidth = px * larg * 2; g.strokeText(txt, x, y); }
    g.fillStyle = cor; g.fillText(txt, x, y);
  }

  // ---------------- peças (1 módulo = 1 pino) ----------------
  const semIndice = g => (g.index ? g.toNonIndexed() : g);
  const juntar = gs => THREE.mergeGeometries(gs.map(g => { const n = semIndice(g); n.deleteAttribute('uv1'); return n; }));
  const perfilPino = [[.3, 0], [.3, .17], [.288, .192], [.262, .2], [0, .2]].map(([x, y]) => new THREE.Vector2(x, y));
  function geoPino(x = 0, y = 0, z = 0, s = 1) { const g = new THREE.LatheGeometry(perfilPino, 24); g.scale(s, s, s); g.translate(x, y, z); return g; }
  // Bloco arredondado (tijolo/placa/ladrilho) com a base em y = 0; pinos: grade w×d em cima (ou lista [[x,z]…])
  function bloco(w, h, d, { pinos = true, r = .05, s = 1 } = {}) {
    const g = new THREE.RoundedBoxGeometry(w, h, d, 3, Math.min(r, w / 2 - .001, h / 2 - .001, d / 2 - .001)); g.translate(0, h / 2, 0);
    const lista = [g];
    if (pinos === true) { for (let i = 0; i < Math.round(w); i++) for (let k = 0; k < Math.round(d); k++) lista.push(geoPino(-w / 2 + .5 + i, h, -d / 2 + .5 + k, s)); }
    else if (Array.isArray(pinos)) pinos.forEach(([x, z]) => lista.push(geoPino(x, h, z, s)));
    return juntar(lista);
  }
  const tijolo = (w, d, op = {}) => bloco(w, 1.2, d, op);
  const placa = (w, d, op = {}) => bloco(w, .4, d, op);
  const ladrilho = (w, d, op = {}) => bloco(w, .4, d, { ...op, pinos: false });
  // Sólido de revolução com chanfro: r (raio), h (altura); pino: no topo (escala); topo/base podem ter raios diferentes
  function redonda(r, h, { pino = true, sp = 1, r2 = r, c = .05, segs = 48 } = {}) {
    const perfil = [[0, 0], [r - c, 0], [r, c], [r2, h - c], [r2 - c, h], [0, h]].map(([x, y]) => new THREE.Vector2(Math.max(0, x), y));
    const g = new THREE.LatheGeometry(perfil, segs);
    return pino ? juntar([g, geoPino(0, h, 0, sp)]) : g;
  }
  const torno = (pontos, segs = 48) => new THREE.LatheGeometry(pontos.map(([x, y]) => new THREE.Vector2(x, y)), segs);
  const barra = (r, comp, segs = 20) => { const g = new THREE.CapsuleGeometry(r, Math.max(.001, comp - 2 * r), 8, segs); g.translate(0, comp / 2, 0); return g; };
  const esfera = (r, ws = 40, hs = 28) => new THREE.SphereGeometry(r, ws, hs);
  function extrudar(forma, prof, { chanfro = .05 } = {}) {
    const g = new THREE.ExtrudeGeometry(forma, { depth: Math.max(.001, prof - 2 * chanfro), bevelEnabled: chanfro > 0, bevelThickness: chanfro, bevelSize: chanfro, bevelSegments: 3, curveSegments: 24 });
    g.translate(0, 0, -(prof - 2 * chanfro) / 2); return g;
  }
  function formaRet(w, h, r) { const s = new THREE.Shape(), x = -w / 2, y = -h / 2; s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r); s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h); s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r); s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y); return s; }
  function estrela(pontas, rFora, rDentro) { const s = new THREE.Shape(); for (let i = 0; i < pontas * 2; i++) { const a = i / (pontas * 2) * Math.PI * 2 + Math.PI / 2, r = i % 2 ? rDentro : rFora; s[i ? 'lineTo' : 'moveTo'](Math.cos(a) * r, Math.sin(a) * r); } return s; }
  function malha(geo, mat, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0) { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.rotation.set(rx, ry, rz); m.castShadow = m.receiveShadow = true; return m; }
  const grupo = (...filhos) => { const g = new THREE.Group(); filhos.flat().forEach(f => f && g.add(f)); return g; };
  const em = (obj, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, s = 1) => { obj.position.set(x, y, z); obj.rotation.set(rx, ry, rz); obj.scale.setScalar(s); return obj; };
  // Brilho de 4 pontas (estrelinha de "plim") voltado para a câmera
  function brilho(tam = .6, cor = BRANCO) {
    const s = new THREE.Shape(); const p = [[0, 1], [.18, .18], [1, 0], [.18, -.18], [0, -1], [-.18, -.18], [-1, 0], [-.18, .18]];
    p.forEach(([x, y], i) => s[i ? 'lineTo' : 'moveTo'](x * tam, y * tam));
    const m = malha(extrudar(s, .12, { chanfro: .03 }), luz(cor, .55)); m.castShadow = false; m.userData.encara = true; return m;
  }
  // Modelo de dados/modelos.js (Kenney CC0 e próprios): plástico da receita mantendo as cores de vértice
  function modelo(id, { escala = 1, tinta = null } = {}) {
    return new Promise((ok, erro) => new THREE.GLTFLoader().parse(Modelos3D.buffer(id), '', gltf => {
      gltf.scene.traverse(o => {
        if (!o.isMesh) return;
        o.castShadow = o.receiveShadow = true;
        const velho = o.material, nome = velho.name;
        o.material = new THREE.MeshStandardMaterial({ vertexColors: !!o.geometry.attributes.color, color: nome === 'tinta' && tinta ? tinta : velho.color, roughness: .32, metalness: 0, side: THREE.FrontSide });
      });
      gltf.scene.scale.setScalar(escala); ok(gltf.scene);
    }, erro));
  }

  // Troca cores de vértice de um modelo: regras [{ de: [matizMin, matizMax], sat: min, para: '#hex' }]
  function recolorir(obj, regras) {
    const c = new THREE.Color(), hsl = {};
    obj.traverse(o => {
      const a = o.isMesh && o.geometry.getAttribute('color');
      if (!a) return;
      o.geometry = o.geometry.clone(); const cor = o.geometry.getAttribute('color');
      for (let i = 0; i < cor.count; i++) {
        c.fromBufferAttribute(cor, i); c.getHSL(hsl); const h = hsl.h * 360;
        const r = regras.find(r => h >= r.de[0] && h <= r.de[1] && hsl.s >= (r.sat ?? .25) && hsl.l >= (r.luz?.[0] ?? 0) && hsl.l <= (r.luz?.[1] ?? 1));
        if (r) { const alvo = new THREE.Color(r.para), ah = {}; alvo.getHSL(ah); c.setHSL(ah.h, ah.s, Math.min(.95, ah.l * (r.manterLuz ? hsl.l / .5 : 1))); cor.setXYZ(i, c.r, c.g, c.b); }
      }
      cor.needsUpdate = true;
    });
    return obj;
  }

  // ---------------- o estúdio ----------------
  function estudio(obj, { giro = -32, elev = 24, ocupa = .78, centro = .46, fov = 22, chao = true, contorno = true } = {}) {
    iniciar();
    const cena = new THREE.Scene(); cena.environment = ambiente; cena.environmentIntensity = .35;
    cena.add(new THREE.HemisphereLight('#EAF4FF', '#5B4C8C', .9));
    const chave = new THREE.DirectionalLight('#FFF1DC', 2.4); chave.castShadow = true;
    chave.shadow.mapSize.set(2048, 2048); chave.shadow.radius = 4; chave.shadow.bias = -.0004; chave.shadow.normalBias = .02;
    const recorte = new THREE.DirectionalLight('#A8DBFF', 1.4);
    cena.add(chave, recorte, chave.target);
    const pivo = new THREE.Group(); pivo.add(obj); pivo.rotation.y = THREE.MathUtils.degToRad(giro); cena.add(pivo);
    pivo.updateMatrixWorld(true);
    const caixa = new THREE.Box3().setFromObject(pivo), esf = caixa.getBoundingSphere(new THREE.Sphere()), tam = caixa.getSize(new THREE.Vector3());

  // ---------- GLOBO DE MESA (esfera de peças, como o mascote, sem rosto) ----------
  const K = [[.9986, -.062], [1, 0], [.9986, .062], [.9954, .124], [.99, .186], [.9822, .248], [.973, .31], [.96, .372], [.9427, .434], [.9216, .4958],
    [.8962, .5571], [.8679, .6176], [.835, .6769], [.7986, .7346], [.7597, .7903], [.7186, .8435], [.6732, .8936], [.6213, .9394], [.5722, .9761], [.5322, 1]]
    .map(([x, y]) => [x, y * 1.593415793900743]);
  function lugar(lon, lat) {   // 'terra' | 'areia' | 'gelo' | null (mar), pelo MAPA do jogo
    if (lat > 70 || lat < -62) return 'gelo';
    if (typeof MAPA === 'undefined') return null;
    const M = MAPA, fi = lat * Math.PI / 180, i = Math.min(18, Math.abs(fi) * 36 / Math.PI), i0 = Math.floor(i), di = i - i0;
    const [ax, ay] = K[i0], [bx, by] = K[i0 + 1], [cx, cy] = K[Math.min(19, i0 + 2)];
    const x = lon * Math.PI / 180 * (bx + di * (cx - ax) / 2 + di * di * (cx - 2 * bx + ax) / 2), y = Math.sign(fi) * (by + di * (cy - ay) / 2 + di * di * (cy - 2 * by + ay) / 2);
    const col = Math.floor((x - M.x0) / M.cel), lin = Math.floor((M.y0 - y) / M.cel);
    if (lin < 0 || lin >= M.linhas) return null;
    const ch = M.celulas[lin * M.colunas + ((col % M.colunas) + M.colunas) % M.colunas];
    if (ch === '.' || ch === '~' || ch === undefined) return null;
    if (M.territorios[M.alfabeto.indexOf(ch)] === 'groenlandia') return 'gelo';
    const deserto = (lat > 15 && lat < 31 && lon > -14 && lon < 33) || (lat > 15 && lat < 30 && lon > 38 && lon < 56) || (lat > -30 && lat < -20 && lon > 122 && lon < 142);
    return deserto ? 'areia' : 'terra';
  }
  function esferaDePecas(R, n, { lonCentro = -20 } = {}) {
    const g = new THREE.Group();
    g.add(malha(esfera(R * .985, 48, 32), plastico('#2397CF', .3)));
    const pecaTerra = juntar([redonda(.5, .38, { pino: false, segs: 16 }), geoPino(0, .38, 0, .8)]), pecaMar = redonda(.5, .16, { pino: false, segs: 16 });
    const grupos = { terra: [], areia: [], gelo: [], mar: [] };
    const dir = new THREE.Vector3(), q = new THREE.Quaternion(), up = new THREE.Vector3(0, 1, 0), m = new THREE.Matrix4(), ouro = Math.PI * (3 - Math.sqrt(5));
    for (let i = 0; i < n; i++) {
      const y = 1 - (i + .5) / n * 2, r = Math.sqrt(1 - y * y), th = ouro * i;
      dir.set(Math.cos(th) * r, y, Math.sin(th) * r);
      const lat = Math.asin(y) * 180 / Math.PI, lon = ((Math.atan2(dir.x, dir.z) * 180 / Math.PI) + lonCentro + 540) % 360 - 180;
      const tipo = lugar(lon, lat) || 'mar';
      q.setFromUnitVectors(up, dir); const esc = (R * 2.9) / Math.sqrt(n) * (tipo === 'mar' ? 1.02 : 1.0);
      m.compose(dir.clone().multiplyScalar(R * .97), q, new THREE.Vector3(esc, esc, esc)); grupos[tipo].push(m.clone());
    }
    const cores = { terra: '#7CCB4E', areia: '#F2D58A', gelo: '#F6FAFD', mar: '#38B1DC' };
    for (const [tipo, mats] of Object.entries(grupos)) {

      const im = new THREE.InstancedMesh(tipo === 'mar' ? pecaMar : pecaTerra, plastico(cores[tipo], tipo === 'mar' ? .2 : .3), mats.length);
      mats.forEach((mm, k) => im.setMatrixAt(k, mm)); im.castShadow = im.receiveShadow = true; g.add(im);

    const opcao = (cat, obj, cargo, fala, decidido) => `<div class="v-opcao peca cat-${cat}">${arte(obj)}<span class="v-cargo">${cargo}</span><div class="balao peca" data-ponta="nenhuma">${fala}</div>` +
      `<button class="btn btn-principal btn-mini peca pinos">Escolher</button>${decidido ? '<span class="carimbo indigo">Decidido</span>' : ''}</div>`;
    const painel = `<section class="painel peca pinos v-painel" data-equipe="brasil" style="position:relative">${ponteiroVez()}<header class="painel-cab">${arte('maleta', { classe: 'painel-objeto' })}<h2 class="painel-titulo">Gabinete do Brasil</h2></header>` +
      `<div class="tela"><p style="font:800 var(--fs-corpo)/1.3 var(--f-texto)">A soja avança sobre o Cerrado. Proteger a vegetação ou ampliar as exportações?</p><div class="v-opcoes">` +
      opcao('natureza', 'caixa-alimentos', 'Conselheira de Natureza', 'Proteger o Cerrado e pagar mais caro pela terra', true) +
      opcao('economia', 'moedas', 'Conselheiro de Economia', 'Ampliar as exportações e a renda do campo') +
      opcao('ciencia', 'lampada', 'Conselheira de Ciência', 'Investir em produtividade sem desmatar') + '</div></div></section>';
    const pids = ['brasil', 'eua', 'china', 'ue', 'india', 'russia'];
    const balanco = `<div class="v-balanco"><div class="v-indic peca">${'<h4>' + imgIcone('🌡', 40) + 'Temperatura</h4>'}<span class="num">1,45 ${GLIFOS.seta} 1,62 °C</span>${termometroTijolos(1.62, { valor: false })}</div>` +
      `<div class="v-indic peca"><h4>Relógio do Juízo Final</h4><div style="display:flex;align-items:center;gap:calc(2*var(--u))">${relogioJuizo(84, { grande: true })}<span class="num">84 s</span></div></div>` +
      `<div class="v-indic peca" style="grid-column:1/-1"><h4>${imgIcone('📊', 40)}Índice de Influência (IGI)</h4>${graficoTijolos(pids.map((pid, i) => ({ pid, valor: [62, 71, 68, 74, 55, 49][i] })), { max: 100 })}</div>` +
      `<div class="v-indic peca" style="grid-column:1/-1"><h4>${imgIcone('🕊', 40)}Por que a cooperação mudou</h4>${cascata([{ texto: 'Acordo do clima', valor: 6 }, { texto: 'Sanções dos EUA à Rússia', valor: -4 }, { texto: 'Ajuda ao Sahel', valor: 3 }])}</div></div>`;
    V.innerHTML = cartao('Página do Jornal Mundial', jornal) + cartao('Plantão Global sobre o mapa', tv, 'mapa') + cartao('Painel com moldura (decisão de gabinete)', painel, 'mesa') + cartao('Balanço do mandato', balanco);
  },
  vinheta() {
    document.body.insertAdjacentHTML('beforeend', vinhetaPlantao({ crise: q.has('crise'), sub: 'Mundo em crise: 2 notícias neste mandato, porque a tensão passou de 80.' }));
    const el = document.querySelector('.vinheta-plantao'), tl = animarVinheta(el);
    if (q.has('fim')) tl?.progress(1);
  },
};
// ?render=<nome>[,<nome>…] | todos: fotografa os objetos do kit no estúdio (usado por ferramentas/renderizar-arte.mjs);
// com &ver, mostra o resultado sobre ladrilho, mesa e mapa em 4 tamanhos (conferência do Teste do Estúdio)
if (q.has('render')) {
  document.querySelector('.v-topo').hidden = true;
  window.resultados = {}; window.falhas = {};
  (async () => {
    await fontesProntas;
    const nomes = q.get('render') === 'todos' ? Object.keys(KIT) : q.get('render').split(',');
    for (const n of nomes) {
      try {
        if (!KIT[n]) throw new Error('sem modelo');
        const obj = await KIT[n].montar();
        window.resultados[n] = Estudio.exportar(Estudio.estudio(obj, KIT[n].cam || {}));
      } catch (e) { window.falhas[n] = String(e && e.stack || e); }
      window.feitos = (window.feitos || 0) + 1;
    }
    if (q.has('ver')) mostrarRenders(nomes.filter(n => resultados[n]));
  })().catch(e => { window.falhas.geral = String(e && e.stack || e); }).finally(() => { window.pronto = true; });
} else fontesProntas.then(() => { MONTAR[secao](); window.pronto = true; });
function mostrarRenders(nomes) {
  V.style.gridTemplateColumns = '1fr 1fr 1fr';
  const linha = n => `<div class="v-linha">${[22, 11, 6.4, 4.4].map(t => `<img src="${resultados[n].url}" style="width:calc(${t} * var(--u))" alt="">`).join('')}<span class="v-rot">${n} · ${resultados[n].kb} KB</span></div>`;
  V.innerHTML = cartao('Ladrilho', nomes.map(linha).join('')) + cartao('Mesa anil', nomes.map(linha).join(''), 'mesa') + cartao('Mapa', nomes.map(linha).join(''), 'mapa');
}
</script>
