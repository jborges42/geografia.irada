<!doctype html>
<!-- Vitrine dos dilemas de governo (desenvolvimento; não faz parte do jogo). Mapa real + motor real + js/dilemas.js.
     ?d=exemplo_nilo | exemplo_terras_raras | exemplo_acolhida | sorteado | <id do conteúdo>  ·  ?pid=brasil|eua|china|ue|india|russia
     ?auto (abre o gabinete sozinho) · ?ia (mostra a vez do computador) · ?leves (gráficos leves) -->
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vitrine dos dilemas</title>
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/arte.css">
<link rel="stylesheet" href="../css/dilemas.css">
<style>
  #vt-barra { position: absolute; left: calc(2 * var(--u)); right: calc(2 * var(--u)); top: calc(1.6 * var(--u)); display: flex; flex-wrap: wrap; gap: calc(.8 * var(--u)); align-items: center; }
  #vt-barra .titulo { font: 400 calc(3.2 * var(--u)) / 1 var(--f-marca); margin-right: calc(.6 * var(--u)); }
  #vt-barra .btn[aria-pressed="true"] { --cor: var(--amarelo); --cor-lado: var(--amarelo-lado); }
  #vt-barra .sep { width: calc(1.2 * var(--u)); }
  #vt-hud { position: absolute; left: calc(2 * var(--u)); right: calc(2 * var(--u)); top: calc(10 * var(--u)); display: flex; flex-wrap: wrap; gap: calc(.8 * var(--u)); }
  #vt-hud .contador { min-height: calc(4.6 * var(--u)); }
  #vt-hud .rot { font-size: var(--fs-min); }
  #vt-hud .vt-nacao { margin-left: auto; }
</style></head>
<body class="jogo">
<div id="mundo" aria-hidden="true"></div>
<div id="rotulos-mapa"></div>
<div id="cena" hidden></div>
<main id="telas"><section id="tela-partida" class="tela" aria-label="Vitrine">
  <div id="vt-barra"><span class="titulo letra-bolha relevo">Dilemas</span></div>
  <div id="vt-hud" aria-label="Indicadores (só da vitrine)"></div>
</section></main>
<div id="camada"></div>
<div id="aviso" role="status" hidden></div>
<div id="anuncio" class="so-leitor" aria-live="polite"></div>

<script src="../lib/three.min.js"></script>
<script src="../lib/gsap.min.js"></script>
<script src="../lib/confetti.min.js"></script>
<script src="../dados/mapa.js"></script>
<script src="../dados/modelos.js"></script>
<script src="../conteudo/potencias.js"></script>
<script src="../conteudo/territorios.js"></script>
<script src="../conteudo/politicas.js"></script>
<script src="../conteudo/eventos.js"></script>
<script src="../conteudo/resolucoes.js"></script>
<script src="../conteudo/dilemas.js"></script>
<script src="../js/icones.js"></script>
<script src="../js/arte.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/simulacao.js"></script>
<script src="../js/bonecos.js"></script>
<script src="../js/mapa3d.js"></script>
<script src="../js/cenas3d.js"></script>
<script src="../js/dilemas.js"></script>
<script>
'use strict';
// ---------- 3 dilemas de exemplo (só na vitrine; o baralho do jogo é conteudo/dilemas.js) ----------
const EXEMPLOS = [
  { id: 'exemplo_nilo', titulo: 'Uma represa no rio Nilo', icone: '💧', local: 'africa_oriental', conceito: 'Geopolítica da água',
    texto: 'A Etiópia encheu a maior hidrelétrica da África, no Nilo Azul. O Egito, que depende do rio para quase toda a sua água, teme a seca e pede apoio {a quem}. A Etiópia quer investimento para levar luz às casas.',
    vocesabia: 'O Nilo atravessa 11 países. Quem controla a nascente de um rio pode mudar a vida de quem mora rio abaixo.',
    bncc: ['EM13CHS204', 'EM13CHS306'],
    opcoes: [
      { texto: 'Financiar as linhas de energia da represa e ganhar um parceiro na região.', resumo: 'Investir na represa', categoria: 'economia',
        efeitos: [{ v: 'economia', d: -1 }, { v: 'influencia', d: 2 }, { v: 'local.desenvolvimento', d: 2 }, { v: 'global.tensao', d: 1 }],
        porque: 'Investir traz contratos e amigos na Etiópia, mas o Egito vê o gesto como apoio ao rival, e a tensão no Nilo sobe.',
        manchete: '{quem} {financia|financiam} a energia da grande represa do Nilo, e o Egito protesta' },
      { texto: 'Propor um acordo de partilha da água, com medições abertas aos três países.', resumo: 'Mediar a partilha da água', categoria: 'diplomacia',
        efeitos: [{ v: 'cp', d: -1 }, { v: 'global.cooperacao', d: 2 }, { v: 'local.estabilidade', d: 3 }, { v: 'influencia', d: 1 }],
        porque: 'Regras claras de vazão tiram o medo de faltar água. Negociar custa capital político e demora, mas acordos assim costumam durar.',
        manchete: '{quem} {propõe|propõem} acordo para dividir a água do Nilo entre Etiópia, Sudão e Egito' },
      { texto: 'Mandar cientistas medir o rio por satélite e publicar os dados para todos.', resumo: 'Dados abertos de satélite', categoria: 'ciencia',
        efeitos: [{ v: 'economia', d: -1 }, { v: 'global.cooperacao', d: 1 }, { v: 'local.estabilidade', d: 1 }, { v: 'influencia', d: 1 }],
        porque: 'Quando todos veem os mesmos números, o boato perde força e fica mais difícil acusar o vizinho. Só que dado não divide a água sozinho.',
        manchete: 'Satélites {de quem} passam a medir o Nilo, e os dados ficam abertos a todos' },
    ] },
  { id: 'exemplo_terras_raras', titulo: 'Ímãs que movem o mundo', icone: '🧲', local: 'africa_austral', conceito: 'Recursos estratégicos e dependência',
    texto: 'Carros elétricos, turbinas e celulares usam ímãs de terras raras, e quase todo o refino desses metais acontece na China. Uma mina nova apareceu {em local}, e {o quem} precisa decidir o que fazer.',
    vocesabia: 'Segundo a Agência Internacional de Energia, a China refina cerca de 90% das terras raras do mundo.',
    bncc: ['EM13CHS302', 'EM13CHS202'],
    opcoes: [
      { texto: 'Comprar a mina e levar o minério para refinar em casa.', resumo: 'Comprar a mina', categoria: 'economia',
        efeitos: [{ v: 'economia', d: -2 }, { v: 'recursos.minerais', d: 2 }, { v: 'influencia', d: 2 }, { v: 'global.tensao', d: 1 }],
        porque: 'Ter a própria fonte diminui a dependência de um só fornecedor, mas custa caro e é visto como disputa por recursos.',
        manchete: '{quem} {compra|compram} mina de terras raras {em local}' },
      { texto: 'Exigir que a mina contrate gente da região, pague bem e não polua os rios.', resumo: 'Mina com regras justas', categoria: 'pessoas',
        efeitos: [{ v: 'economia', d: -1 }, { v: 'influencia', d: 1 }, { v: 'local.desenvolvimento', d: 2 }, { v: 'local.estabilidade', d: 1 }, { v: 'apoio', d: 1 }],
        porque: 'Quando a riqueza fica também na região, o país ganha parceiros confiáveis. O lucro vem mais devagar, e as regras custam caro.',
        manchete: '{quem} {exige|exigem} regras justas na nova mina {de local}' },
      { texto: 'Investir em reciclagem de ímãs de aparelhos velhos.', resumo: 'Reciclar ímãs', categoria: 'ciencia',
        efeitos: [{ v: 'economia', d: -1 }, { v: 'recursos.minerais', d: 1 }, { v: 'ambiente', d: 2 }],
        porque: 'Reciclar alivia a pressão por novas minas e diminui o lixo eletrônico, mas a tecnologia ainda é cara e não supre tudo de uma vez.',
        manchete: '{quem} {aposta|apostam} na reciclagem de ímãs para depender menos de minas' },
    ] },
  { id: 'exemplo_acolhida', titulo: 'Gente chegando pela fronteira', icone: '🧳', local: 'venezuela_guianas', conceito: 'Migrações e refúgio',
    texto: 'A crise na Venezuela empurra milhares de pessoas para os países vizinhos. Os abrigos da fronteira estão lotados, e prefeituras pedem ajuda {a quem} para acolher, vacinar e achar trabalho para quem chega.',
    vocesabia: 'Desde 2018, a Operação Acolhida, em Roraima, leva venezuelanos para cidades com vagas de emprego em todo o Brasil.',
    bncc: ['EM13CHS201', 'EM13CHS603'],
    opcoes: [
      { texto: 'Abrir abrigos e levar as famílias para cidades com vagas de emprego.', resumo: 'Acolher e interiorizar', categoria: 'pessoas',
        efeitos: [{ v: 'economia', d: -2 }, { v: 'bemEstar', d: 1 }, { v: 'apoio', d: -1 }, { v: 'global.deslocados', d: -3 }, { v: 'global.cooperacao', d: 2 }],
        porque: 'Acolher custa dinheiro e divide opiniões, mas quem consegue trabalho deixa de depender de ajuda e passa a pagar impostos.',
        manchete: '{quem} {abre|abrem} abrigos e {leva|levam} famílias para cidades com emprego' },
      { texto: 'Reforçar o controle da fronteira e limitar a entrada.', resumo: 'Fechar a fronteira', categoria: 'seguranca',
        efeitos: [{ v: 'seguranca', d: 2 }, { v: 'apoio', d: 1 }, { v: 'global.deslocados', d: 2 }, { v: 'global.cooperacao', d: -2 }, { v: 'local.estabilidade', d: -2 }],
        porque: 'Fechar a porta agrada parte da população, mas as pessoas continuam fugindo, agora sem proteção, e a crise na região piora.',
        manchete: '{quem} {fecha|fecham} a fronteira, e famílias ficam presas do outro lado' },
      { texto: 'Pedir à ONU um fundo regional e dividir o acolhimento com os vizinhos.', resumo: 'Dividir com os vizinhos', categoria: 'diplomacia',
        efeitos: [{ v: 'cp', d: -1 }, { v: 'global.cooperacao', d: 3 }, { v: 'global.deslocados', d: -1 }, { v: 'influencia', d: 1 }],
        porque: 'Dividir o esforço alivia todo mundo, mas depende de outros países toparem, e a ajuda demora a chegar.',
        manchete: '{quem} {propõe|propõem} fundo da ONU para dividir o acolhimento na América do Sul' },
    ] },
];
if (typeof DILEMAS === 'undefined') window.DILEMAS = [];
DILEMAS.push(...EXEMPLOS);

const Q = new URLSearchParams(location.search);   // PIDS vem de js/ui.js (as 13 potências)
let pid = PIDS.includes(Q.get('pid')) ? Q.get('pid') : 'brasil', escolhido = Q.get('d') || 'exemplo_nilo';
const avatares = Bonecos.avataresIniciais(PIDS, 11).map(a => ({ ...a, humano: true }));
const e = Simulacao.criarEstado({ modo: 'competitivo', rodadas: 6, semente: 7, jogadores: PIDS.map(p => ({ potencia: p, nome: nomeEquipe(p) })) });

// ---------- Partida de mentira: só o que js/dilemas.js usa (avatar e HUD) ----------
const IND = [['global', 'comercio', '🚢', 'Comércio'], ['global', 'cooperacao', '🕊️', 'Cooperação'], ['global', 'temperatura', '🌡️', 'Temperatura'],
  ['global', 'tensao', '⏰', 'Relógio'], ['global', 'deslocados', '🧳', 'Deslocados'], ['eu', 'economia', '💰', 'Economia'], ['eu', 'apoio', '🗳️', 'Apoio'],
  ['eu', 'seguranca', '🛡️', 'Segurança'], ['eu', 'cp', '', 'CP']];
const valorDe = ([onde, k]) => { const v = onde === 'global' ? e.global[k] : e.potencias[pid][k]; return k === 'tensao' ? (100 - v) * 3 : v; };
const casas = k => (k === 'temperatura' ? 2 : 0), sufixo = k => (k === 'temperatura' ? FINO + '°C' : k === 'tensao' ? FINO + 's' : k === 'deslocados' ? FINO + 'mi' : '');
function montarHud() {
  $('#vt-hud').innerHTML = IND.map((ind, i) => `<span class="contador peca${ind[0] === 'eu' && i === 5 ? ' vt-nacao' : ''}${ind[1] === 'cp' ? ' amarela' : ''}">
    <span class="soquete">${ind[2] ? imgIcone(ind[2], 48) : '<i class="pino-cp"></i>'}</span><b data-k="${i}"></b><span class="rot">${ind[3]}</span></span>`).join('');
  IND.forEach((ind, i) => { const b = $(`#vt-hud [data-k="${i}"]`); b.dataset.v = valorDe(ind); b.textContent = fmt(valorDe(ind), casas(ind[1])) + sufixo(ind[1]); });
}
window.Jogo = {
  estado: e, config: { rodadas: 6 },
  avatarDe: p => avatares.find(a => a.pid === p) || null,
  atualizarHUD() {
    IND.forEach((ind, i) => {
      const b = $(`#vt-hud [data-k="${i}"]`), antes = +b.dataset.v, agora = valorDe(ind);
      if (Math.abs(agora - antes) < 1e-6) return;
      b.dataset.v = agora;
      numeroQueSalta(b, antes, agora, { casas: casas(ind[1]), sufixo: sufixo(ind[1]) });
      if (!RM) gsap.fromTo(b.closest('.contador'), { '--anel': `0 0 0 ${.5 * uPx()}px #FFD21F` }, { '--anel': '0 0 0 0px #FFD21F00', duration: .6 });
    });
  },
};
const Hud = { manchete: t => console.log('Jornal Mundial:', t) };

// ---------- Barra da vitrine ----------
function botao(texto, ativo, fn, dados = '') {
  const b = document.createElement('button');
  b.className = 'btn btn-mini peca btn-neutro'; b.innerHTML = texto; b.setAttribute('aria-pressed', String(!!ativo)); b.dataset.grupo = dados;
  b.onclick = fn; $('#vt-barra').append(b); return b;
}
const marcar = (grupo, b) => $$(`#vt-barra [data-grupo="${grupo}"]`).forEach(x => x.setAttribute('aria-pressed', String(x === b)));
[['exemplo_nilo', 'Nilo'], ['exemplo_terras_raras', 'Terras raras'], ['exemplo_acolhida', 'Acolhida'], ['sorteado', 'Sorteado']].forEach(([id, nome]) => {
  const b = botao(nome, id === escolhido, () => { escolhido = id; marcar('d', b); }, 'd');
});
$('#vt-barra').append(Object.assign(document.createElement('span'), { className: 'sep' }));
PIDS.forEach(p => { const b = botao(formaDe(p) + ' ' + nomeCurto(p), p === pid, () => { pid = p; marcar('p', b); montarHud(); Mapa3D.vez(pid); }, 'p'); });
$('#vt-barra').append(Object.assign(document.createElement('span'), { className: 'sep' }));
const bVez = botao('Abrir o gabinete', false, () => abrirVez());
bVez.classList.replace('btn-neutro', 'btn-principal'); bVez.classList.add('pinos'); bVez.dataset.teste = 'abrir-gabinete';
botao('Vez do computador', false, () => vezIA()).dataset.teste = 'vez-ia';

// Prepara o dilema pedido para a potência (o motor devolve o mesmo dilema enquanto ninguém decide)
function preparar() {
  const p = e.potencias[pid];
  if (escolhido === 'sorteado') { p.dilema = null; return; }
  const d = DILEMAS.find(x => x.id === escolhido);
  // lugar fixo, a própria casa ou (lugar sorteado pelo motor) o primeiro vizinho que for território
  const local = typeof d?.local === 'string' ? (d.local === 'casa' ? pid : d.local) : d?.local ? (MAPA.vizinhos[pid] || []).find(id => e.territorios[id]) || null : null;
  p.dilema = { id: escolhido, local, rodada: e.rodada, opcao: null };
}
let ocupado = false;
async function abrirVez() {
  if (ocupado) return; ocupado = true;
  try { preparar(); Mapa3D.vez(pid); const r = await Dilemas.vez(e, pid); console.log('vez:', JSON.stringify(r && { id: r.id, opcao: r.opcao })); window.ultimo = r; }
  finally { ocupado = false; }
}
async function vezIA() {
  if (ocupado) return; ocupado = true;
  try {
    preparar();
    const d = Simulacao.dilemaDaVez(e, pid);
    if (!d) return;
    const opcao = Simulacao.iaDilema(e, pid, d), resultado = Simulacao.resolverDilema(e, pid, d.id, opcao);
    await Dilemas.mostrarIA(e, pid, { id: d.id, opcao, resultado });
    window.ultimo = { id: d.id, opcao };
  } finally { ocupado = false; }
}

(async () => {
  await fontesProntas;
  Mapa3D.iniciar($('#mundo'));
  Mapa3D.graficos(Q.has('leves') ? 'leves' : 'bonitos');
  Mapa3D.bonecos(avatares);
  await Mapa3D.pronto;
  await Mapa3D.atualizarMundo(e, { animar: false });
  Mapa3D.vez(pid);
  montarHud();
  window.pronto = true;
  if (Q.has('auto')) abrirVez();
  if (Q.has('ia')) vezIA();
})();
</script>
</body>
</html>
