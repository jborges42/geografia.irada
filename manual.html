<!doctype html>
<!-- Manual do Diplomata para imprimir (frente Manual): todas as seções abertas, em folhas A4.
     Na tela, as folhas ficam sobre a mesa anil; na impressão, papel branco com as cores das abas. Funciona por file://. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manual do Diplomata — Geografia Irada</title>
<meta name="theme-color" content="#22339A">
<link rel="icon" href="img/marca/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="img/marca/favicon-180.png">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/arte.css">
<link rel="stylesheet" href="css/manual.css">
</head>
<body class="mn-livro">
<header class="mn-barra">
  <span id="mn-barra-logo"></span>
  <span class="mn-barra-tit">Manual do Diplomata</span>
  <a class="btn btn-neutro peca" href="index.html">Voltar ao jogo</a>
  <button class="btn btn-principal peca pinos" type="button" id="mn-imprimir">Imprimir</button>
</header>
<main id="livro"></main>
<div id="anuncio" class="so-leitor" aria-live="polite"></div>

<script src="lib/gsap.min.js"></script>
<script src="dados/projecoes.js"></script>
<script src="conteudo/potencias.js"></script>
<script src="conteudo/territorios.js"></script>
<script src="conteudo/politicas.js"></script>
<script src="conteudo/eventos.js"></script>
<script src="conteudo/resolucoes.js"></script>
<script src="conteudo/dilemas.js"></script>
<script src="conteudo/fichas.js"></script>
<script src="conteudo/manual.js"></script>
<script src="conteudo/bncc.js"></script>
<script src="js/icones.js"></script>
<script src="js/arte.js"></script>
<script src="js/ui.js"></script>
<script src="js/simulacao.js"></script>
<script src="js/hud.js"></script>
<script src="js/manual.js"></script>
<script>
  'use strict';
  document.getElementById('livro').innerHTML = Manual.livro();
  if (typeof logo === 'function') document.getElementById('mn-barra-logo').innerHTML = logo('horizontal', 'mn-logo');
  document.getElementById('mn-imprimir').onclick = () => print();
  // manual.html?imprimir abre direto a janela de impressão (depois das fontes)
  if (new URLSearchParams(location.search).has('imprimir')) fontesProntas.then(() => setTimeout(print, 300));
</script>
</body>
</html>
