<!doctype html>
<!-- ESQUELETO da Fundação: o dono da frente substitui.
     Manual do Diplomata para imprimir: todos os capítulos de conteudo/manual.js em sequência, em papel branco. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manual do Diplomata — Geografia Irada</title>
<link rel="icon" href="img/favicon.png" type="image/png">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/manual.css">
<style>
  body { background: #fff; padding: 32px 6vw; font-size: 18px; }
  h1 { font: 400 48px / 1 var(--f-marca); text-transform: uppercase; margin-bottom: 24px; }
  article { break-inside: avoid-page; margin-bottom: 32px; }
  article > h2 { font: 700 30px / 1.1 var(--f-titulo); margin-bottom: 12px; }
</style>
</head>
<body>
<h1>Manual do Diplomata</h1>
<main id="manual"></main>
<script src="conteudo/manual.js"></script>
<script src="js/simulacao.js"></script>
<script>
  'use strict';
  const valor = k => { const v = k.split('.').reduce((o, p) => o?.[p], typeof Simulacao !== 'undefined' ? Simulacao.PARAM : null);
    return typeof v === 'number' ? v.toLocaleString('pt-BR') : v ?? ''; };
  document.getElementById('manual').innerHTML = (typeof MANUAL !== 'undefined' ? MANUAL : []).map(c =>
    `<article><h2>${c.titulo}</h2>${String(c.html).replace(/\{\{([\w.]+)\}\}/g, (_, k) => valor(k))}</article>`).join('');
</script>
</body>
</html>
